# Local infra for Eventify (Session 3+).
#   docker compose up -d
# DATABASE_URL (postgres) and REDIS_URL (redis) live in .env.
services:
  postgres:
    image: postgres:17-alpine
    container_name: eventify-postgres
    environment:
      POSTGRES_USER: eventify
      POSTGRES_PASSWORD: eventify
      POSTGRES_DB: eventify
    ports:
      - "5433:5432"
    volumes:
      - eventify-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventify -d eventify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: eventify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eventify-pg-data:
