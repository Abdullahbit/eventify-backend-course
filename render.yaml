services:
  # 1. Web Service (API)
  - type: web
    name: eventify-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts
    startCommand: node src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: http://localhost:3000
      - key: PORT
        value: 10000

  # 2. Background Worker (BullMQ Queues)
  - type: worker
    name: eventify-worker
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: node src/worker.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
